<svg fill="none" viewBox="0 0 1200 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <!-- Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.05); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes barGrow {
        0%, 100% { height: 35px; y: 225px; }
        50% { height: 75px; y: 185px; }
      }
      @keyframes blinkBeacon {
        0%, 100% { r: 4px; opacity: 0.4; }
        50% { r: 8px; opacity: 1; }
      }

      .animated-grid { opacity: 0.6; }
      .floating-node { animation: floatSlow 6s ease-in-out infinite; }
      .ambient-glow { animation: pulseGlow 8s ease-in-out infinite; transform-origin: center; }
      .streaming-line { stroke-dasharray: 8 6; animation: dashFlow 2s linear infinite; }
      .bar-dynamic-1 { animation: barGrow 4s ease-in-out infinite; }
      .bar-dynamic-2 { animation: barGrow 4s ease-in-out 1s infinite; }
      .bar-dynamic-3 { animation: barGrow 4s ease-in-out 2s infinite; }
      .beacon-dot { animation: blinkBeacon 2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />
  <rect width="1200" height="360" rx="16" fill="url(#cyberGrid)" class="animated-grid" />

  <!-- Ambient Glowing Orbs (Behind content) -->
  <circle cx="200" cy="90" r="140" fill="#38bdf8" filter="blur(80px)" class="ambient-glow" opacity="0.25" />
  <circle cx="1020" cy="240" r="150" fill="#8b5cf6" filter="blur(90px)" class="ambient-glow" opacity="0.3" />
  <circle cx="650" cy="180" r="110" fill="#06b6d4" filter="blur(75px)" class="ambient-glow" opacity="0.15" />

  <!-- Abstract Analytics Graphics & Dynamic Waveflows (Subtle Background Decor) -->
  <g opacity="0.45" class="floating-node">
    <!-- Chart waveform -->
    <path d="M 50 310 Q 200 260 350 280 T 650 210 T 950 180 T 1150 130" fill="none" stroke="#38bdf8" stroke-width="2" class="streaming-line" />
    <path d="M 50 310 Q 200 260 350 280 T 650 210 T 950 180 T 1150 130 L 1150 340 L 50 340 Z" fill="url(#chartGrad)" />

    <!-- Secondary Wave -->
    <path d="M 50 330 Q 250 290 450 310 T 800 260 T 1150 200" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Data Metric Bars on Top Right Side (Non-obtrusive background telemetry decoration) -->
  <g opacity="0.4">
    <rect x="940" y="210" width="12" height="50" rx="3" fill="#38bdf8" class="bar-dynamic-1" />
    <rect x="965" y="195" width="12" height="65" rx="3" fill="#6366f1" class="bar-dynamic-2" />
    <rect x="990" y="175" width="12" height="85" rx="3" fill="#a855f7" class="bar-dynamic-3" />
    <rect x="1015" y="200" width="12" height="60" rx="3" fill="#06b6d4" class="bar-dynamic-1" />
    <rect x="1040" y="185" width="12" height="75" rx="3" fill="#ec4899" class="bar-dynamic-2" />
  </g>

  <!-- Glowing Telemetry Dots (Root Cause Node Graph) -->
  <g opacity="0.6">
    <circle cx="820" cy="90" r="5" fill="#38bdf8" class="beacon-dot" />
    <line x1="820" y1="90" x2="890" y2="120" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="890" cy="120" r="4" fill="#6366f1" />
    <line x1="890" y1="120" x2="960" y2="85" stroke="#6366f1" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="960" cy="85" r="5" fill="#ec4899" class="beacon-dot" />
    <line x1="890" y1="120" x2="930" y2="160" stroke="#818cf8" stroke-width="1" stroke-dasharray="2 2" />
    <circle cx="930" cy="160" r="3" fill="#a855f7" />
  </g>

  <!-- High-contrast Badge pill (Forefront) -->
  <g transform="translate(80, 52)">
    <rect width="280" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
    <circle cx="16" cy="16" r="5" fill="#10b981" class="beacon-dot" />
    <text x="30" y="21" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">ENTERPRISE TELEMETRY &amp; AI</text>
  </g>

  <!-- Main Title (Strictly Forefront, High-Contrast Crisp Typography) -->
  <text x="80" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
    Operational Insights &amp;
  </text>
  <text x="80" y="200" fill="url(#cyanBlueGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
    Predictive Analytics
  </text>

  <!-- Subtitle (Forefront) -->
  <text x="80" y="248" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="16" font-weight="400">
    Curated telemetry suites, ML anomaly detection engines, time-series forecasting &amp; automated RCA platforms.
  </text>

  <!-- Feature Pills (Forefront Footer) -->
  <g transform="translate(80, 276)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="14" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">⚡ Telemetry &amp; APM</text>

    <!-- Pill 2 -->
    <rect x="142" y="0" width="145" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="156" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">🔍 Anomaly Detection</text>

    <!-- Pill 3 -->
    <rect x="299" y="0" width="150" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="313" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">📈 TS Forecasting</text>

    <!-- Pill 4 -->
    <rect x="461" y="0" width="140" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="475" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">🎯 AI Root Cause</text>
  </g>

  <!-- Border Frame Glow -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="15.5" fill="none" stroke="#334155" stroke-width="1" />
</svg>
